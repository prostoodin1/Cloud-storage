name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            core_go/go.sum
            drive_windows/go.sum
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - name: Install project
        run: python -m pip install -e ".[dev,build]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Test native Go Core
        working-directory: core_go
        run: go test ./...
      - name: Vet native Go Core
        working-directory: core_go
        run: go vet ./...
      - name: Build standalone manager
        run: python -m PyInstaller --noconfirm --clean packaging/CloudStorageServer.spec
      - name: Build Python compatibility core on Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean packaging/CloudStorageLegacyCore.spec
      - name: Build native Go Core and Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build-core-go.ps1
      - name: Build standalone core on Unix
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --clean packaging/CloudStorageCore.spec
      - name: Build standalone desktop client
        run: python -m PyInstaller --noconfirm --clean packaging/CloudStorageClient.spec
      - name: Package MacBook applications
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CloudStorageServer-${{ runner.os }}
          path: |
            dist/CloudStorageServerManager/
            dist/CloudStorageServerCore/
            dist/CloudStorageLegacyCore/
            dist/CloudStorageServerService/
            dist/CloudStorageClient/
            dist/Cloud Storage Server Manager.app/
            dist/Cloud Storage Client.app/
            dist/macos-release/*.dmg
            dist/macos-release/SHA256SUMS.txt
          if-no-files-found: warn
