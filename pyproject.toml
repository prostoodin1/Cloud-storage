[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-storage-server"
version = "0.9.17"
description = "Safe cross-platform home cloud server control application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cloud Storage contributors" }]
dependencies = [
  "PySide6>=6.8,<7",
  "psutil>=5.9,<8",
  "argon2-cffi>=23.1,<26",
  "cryptography>=49,<50",
  "fastapi>=0.115,<1",
  "qrcode>=8,<9",
  "uvicorn>=0.30,<1",
  "pywin32>=308,<400; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
cloud-storage-server = "cloud_storage.main:main"
cloud-storage-core = "cloud_storage.core.main:main"
cloud-storage-client = "cloud_storage.client.main:main"
cloud-storage-containers = "cloud_storage.container_manager.main:main"

[tool.setuptools.packages.find]
include = ["cloud_storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
