name: mobile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "cloud_storage/core/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "mobile/**"
      - "cloud_storage/core/**"
      - ".github/workflows/mobile.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm doctor
      - run: pnpm exec expo export --platform android --output-dir dist-android
      - run: pnpm exec expo export --platform ios --output-dir dist-ios

  android-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: client
            output: CloudStorage-Mobile-Client-0.9.9-android.apk
          - variant: manager
            output: CloudStorage-Mobile-Manager-0.9.9-android.apk
    env:
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Configure private release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CLOUD_STORAGE_ANDROID_KEYSTORE: cloud-storage-release.p12
          CLOUD_STORAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOUD_STORAGE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLOUD_STORAGE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cloud-storage-release.p12
          node scripts/configure-android-signing.mjs
      - name: Build signed APK
        env:
          CLOUD_STORAGE_ANDROID_KEYSTORE: cloud-storage-release.p12
          CLOUD_STORAGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLOUD_STORAGE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLOUD_STORAGE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: mobile/android
      - name: Name release files
        env:
          MOBILE_OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/$MOBILE_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: CloudStorage-Mobile-${{ matrix.variant }}-0.9.9-android-release
          path: mobile/release/*
          if-no-files-found: error

  android-screenshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: client
            package: com.cloudstorage.mobile
            screenshot_screen: files
          - variant: manager
            package: com.cloudstorage.manager
            screenshot_screen: server
    env:
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build self-contained screenshot APK
        env:
          EXPO_PUBLIC_SCREENSHOT_SCREEN: ${{ matrix.screenshot_screen }}
        run: ./gradlew assembleRelease
        working-directory: mobile/android
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture Android screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop ${{ matrix.package }}
            adb shell monkey -p ${{ matrix.package }} 1
            sleep 8
            mkdir -p mobile/screenshots
            adb exec-out screencap -p > mobile/screenshots/CloudStorage-Mobile-${{ matrix.variant }}-0.9.9-android.png
      - uses: actions/upload-artifact@v4
        with:
          name: CloudStorage-Mobile-${{ matrix.variant }}-0.9.9-android-screenshot
          path: mobile/screenshots/*.png
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: client
            bundle: com.cloudstorage.mobile
            output: CloudStorage-Mobile-Client-0.9.9-apple-simulator.zip
            device_output: CloudStorage-Mobile-Client-0.9.9-unsigned.ipa
            screenshot_screen: files
          - variant: manager
            bundle: com.cloudstorage.manager
            output: CloudStorage-Mobile-Manager-0.9.9-apple-simulator.zip
            device_output: CloudStorage-Mobile-Manager-0.9.9-unsigned.ipa
            screenshot_screen: server
    env:
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with Swift 6.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --no-install --clean
      - run: pod install
        working-directory: mobile/ios
      - name: Build unsigned simulator application
        env:
          EXPO_PUBLIC_SCREENSHOT_SCREEN: ${{ matrix.screenshot_screen }}
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iPhone and iPad package
        env:
          MOBILE_DEVICE_OUTPUT: ${{ matrix.device_output }}
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH=$(find build/ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -d "$APP_PATH"
          mkdir -p release/Payload
          cp -R "$APP_PATH" release/Payload/
          (cd release && zip -qry "$MOBILE_DEVICE_OUTPUT" Payload)
          rm -rf release/Payload
      - name: Package and capture iPhone application
        timeout-minutes: 15
        env:
          MOBILE_BUNDLE: ${{ matrix.bundle }}
          MOBILE_OUTPUT: ${{ matrix.output }}
          MOBILE_VARIANT: ${{ matrix.variant }}
        run: |
          APP_PATH=$(find build/ios-derived/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -d "$APP_PATH"
          mkdir -p release screenshots
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/$MOBILE_OUTPUT"
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; rows=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; print(rows[-1]["identifier"])')
          for FAMILY in iPhone iPad; do
            if [ "$FAMILY" = "iPhone" ]; then
              MODEL="iPhone 16 Pro"
            else
              MODEL="iPad Pro 13-inch (M4)"
            fi
            DEVICE_ID=$(xcrun simctl create "Cloud Storage $MOBILE_VARIANT $FAMILY" "$MODEL" "$RUNTIME" 2>/dev/null || true)
            if [ -z "$DEVICE_ID" ]; then
              DEVICE_ID=$(xcrun simctl list devices available -j | FAMILY="$FAMILY" python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for values in d.values() for v in values if os.environ["FAMILY"] in v["name"]))')
            fi
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b
            xcrun simctl install "$DEVICE_ID" "$APP_PATH"
            xcrun simctl launch "$DEVICE_ID" "$MOBILE_BUNDLE"
            sleep 8
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/CloudStorage-Mobile-$MOBILE_VARIANT-0.9.9-$FAMILY.png"
            xcrun simctl shutdown "$DEVICE_ID" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CloudStorage-Mobile-${{ matrix.variant }}-0.9.9-apple-simulator
          path: |
            mobile/release/*.zip
            mobile/release/*.ipa
            mobile/screenshots/*.png
          if-no-files-found: error
