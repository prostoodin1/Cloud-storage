<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Storage — общий файл</title>
  <link rel="stylesheet" href="/web/assets/share.css">
  <script src="/web/assets/share.js" defer></script>
</head>
<body>
  <header><span class="logo">CS</span><strong>Cloud Storage</strong></header>
  <main>
    <section class="card">
      <span class="eyebrow">ОБЩИЙ ДОСТУП</span>
      <h1 id="name">Загружаем файл…</h1>
      <p id="meta" class="muted"></p>
      <div id="preview" class="preview"></div>
      <p id="error" class="error" hidden></p>
      <a id="download" class="button" hidden>Скачать</a>
      <p class="notice">По этой ссылке доступен только этот объект. Остальные файлы и папки владельца скрыты.</p>
    </section>
  </main>
</body>
</html>
